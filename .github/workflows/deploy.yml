name: Deploy API + legal site to Vercel

# The Vercel project serves only api/ and site/ (see vercel.json); the Flutter app
# ships through the stores. Production deploys are manual so nothing goes live
# from a push without the owner's approval. Needs a valid VERCEL_TOKEN secret.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: npx vercel@65 --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

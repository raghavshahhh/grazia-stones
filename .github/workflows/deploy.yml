name: Build & Deploy Flutter Web to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --dart-define=SUPABASE_URL=https://jrrmjtbauimrrxwjvmzh.supabase.co --dart-define=SUPABASE_ANON_KEY=sb_publishable_l0K305hiCMwZ8Mh3lON3YQ_ueSMXo4a

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}


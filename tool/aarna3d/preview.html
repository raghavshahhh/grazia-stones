<!doctype html><meta charset=utf8><title>Aarna 3D preview</title>
<style>html,body{margin:0;background:#f1e6d6;font-family:Georgia,serif}model-viewer{width:100vw;height:100vh}
.bar{position:fixed;left:16px;top:16px;display:flex;gap:8px}button{padding:10px 18px;border:1px solid #b8934a;background:#fff8ec;color:#5a4320;border-radius:999px;font-size:15px;cursor:pointer}</style>
<script type=module src="vendor/model-viewer.min.js"></script>
<model-viewer id=m src="out/aarna.glb" autoplay animation-name="Idle" camera-controls camera-orbit="0deg 82deg 2.3m" camera-target="0m 0.41m 0m" field-of-view="28deg" shadow-intensity="1.1" shadow-softness="0.8" exposure="1.15" environment-image="neutral" interaction-prompt="none"></model-viewer>
<div class=bar><button onclick="wave()">Wave</button><button onclick="m.animationName='Idle';m.play()">Idle</button></div>
<script>const m=document.getElementById('m');function wave(){m.animationName='Wave';m.timeScale=1;m.play({repetitions:1});}
m.addEventListener('finished',()=>{m.animationName='Idle';m.play({repetitions:Infinity})});</script>
